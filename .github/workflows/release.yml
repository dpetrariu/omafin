name: Release

# Pushing a tag vX.Y.Z builds the backend for each architecture and publishes
# a GitHub release with the archives and their checksums. The plugin and
# install.sh download from there, so nobody has to compile.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the versions in the code
        run: |
          version="${TAG#v}"
          grep -q "^version = \"$version\"" Cargo.toml || { echo "Cargo.toml is not $version"; exit 1; }
          grep -q "\"version\": \"$version\"" manifest.json || { echo "manifest.json is not $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # No build cache here: what ships is built from the tag alone.
      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          version="${TAG#v}"
          asset="omafin-$version-linux-${{ matrix.arch }}.tar.gz"
          ./target/release/omafin version | grep -q "^omafin $version "
          tar -czf "$asset" -C target/release omafin
          sha256sum "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-${{ matrix.arch }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          cat *.sha256 > SHA256SUMS
          rm *.sha256
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS

      # A published release is never replaced: installs pin these archives by
      # checksum (backend.sha256), so a fix ships as a new version.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published and is not replaced; release a new version instead" >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --title "Omafin ${TAG#v}" --generate-notes --verify-tag
