name: CI

# Every push and pull request: unit tests, the backend end-to-end test
# against the mock Jellyfin, and the UI logic tests. The off-screen UI test
# needs an Omarchy shell and runs locally (make test-ui).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Unit tests
        run: cargo test --locked
      - name: Build
        run: cargo build --locked
      - name: ffmpeg for the test video
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Backend end-to-end
        run: python3 tests/backend_e2e.py target/debug/omafin
      - name: Downloads end-to-end
        run: python3 tests/downloads_e2e.py target/debug/omafin
      - name: UI logic
        run: node tests/ui_logic.js
      - name: Shell scripts parse
        run: for f in install.sh scripts/*.sh; do bash -n "$f"; done
