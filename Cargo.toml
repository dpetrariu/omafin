[package]
name = "omafin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Jellyfin movies and shows for the Omarchy shell"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "io-std", "fs", "process", "signal"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
sha1 = "0.11"
hex = "0.4"
getrandom = "0.3"
percent-encoding = "2"
url = "2"
walkdir = "2"
libc = "0.2"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
